<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="./src/css/estilo.css">
    <title>FluenteFlow</title>
</head>
<body>
    <header>
        <h1 id="logo">Fluente<span>Flow</span></h1>
        <nav id="nav-menu">
            <ul>
                <li><a href="planejamento.html">Planejamento</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="container">
        <main>
            <section class="card">
                <div class="card-geral">
                    <h1>Meu planejamento de estudos</h1>
                    <p>Veja o que você precisa estudar hoje</p>
                    <div id="lista-habilidades">
                        <p id="tempo-estudo"></p>
                    </div>
                    <progress max="100" value="0">oi</progress>
                    <section>
                        <label for="dia">Selecione o dia</label>
                            <select id="dia" name="dia" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="segunda-feira">Segunda-feira</option>
                                <option value="terca-feira">Terça-feira</option>
                                <option value="quarta-feira">Quarta-feira</option>
                                <option value="quinta-feira">Quinta-feira</option>
                                <option value="sexta-feira">Sexta-feira</option>
                                <option value="sabado">Sábado</option>
                                <option value="domingo">Domingo</option>
                            </select>
                    </section>
                </div>
            </section>
        </main>

    <aside>
        <h2>Resumo</h2>
        <p id="resumo-tempo"></p>
        <p id="resumo-tarefas"></p>
        <progress id="resumo-progresso" max="100" value="0"></progress>
    </aside>

     </div>

    <footer>
        <p>© 2026 TODOS OS DIREITOS RESERVADOS</p>
    </footer>
    <script src="src/js/script.js"></script>
</body>
</html>
